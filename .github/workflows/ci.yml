name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Lint
        run: golangci-lint run ./...
      - name: Test
        run: go test ./... -coverprofile=coverage.out -covermode=atomic
        env:
          JWT_SECRET: ci-test-secret
          MONGODB_URI: mongodb://localhost:27017/launchpad
          MONGODB_DATABASE: launchpad
          REDIS_URL: redis://localhost:6379/0
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Run govulncheck
        # Blocking: a known-vulnerable dependency fails the build. New
        # projects may surface findings that need triage — fix or document a
        # justification in the PR rather than silencing the job.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Audit frontend dependencies
        # Non-blocking for now: advisories are triaged asynchronously. Flip to
        # blocking once the current backlog is clean.
        continue-on-error: true
        run: pnpm audit --prod

  migrations:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: launchpad
          MONGO_INITDB_ROOT_PASSWORD: launchpad
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval db.adminCommand('ping')"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Apply MongoDB indexes
        run: go run ./scripts/migrate_indexes
        env:
          JWT_SECRET: ci-test-secret
          MONGODB_URI: mongodb://launchpad:launchpad@localhost:27017/launchpad?authSource=admin
          MONGODB_DATABASE: launchpad
      - name: Build API
        run: go build ./apps/api/...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - run: pnpm --filter @launchpad/platform-admin-web build
      - run: pnpm --filter @launchpad/organization-admin-web build
      - run: pnpm --filter @launchpad/employee-web build
      - run: pnpm --filter @launchpad/marketing-web build
